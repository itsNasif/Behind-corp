name: behind-local
services:
  business-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: behind
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run local:setup}
    ports: ["127.0.0.1:5433:5432"]
    volumes: [business-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d behind"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  identity-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run local:setup}
    volumes: [identity-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  redis:
    image: redis:8.2.10-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run local:setup}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction --appendonly yes',
      ]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    mem_limit: 256m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:8025:8025"]
    mem_limit: 128m
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command:
      [
        "start",
        "--import-realm",
        "--http-enabled=true",
        "--hostname=http://localhost:8080",
        "--hostname-strict=true",
      ]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run local:setup}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Run local:setup}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Run local:setup}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ACCESS_LOG_ENABLED: "false"
      KC_LOG_LEVEL: "WARN,org.keycloak.events:ERROR"
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:9000:9000"]
    volumes:
      - ./.local/behind-realm.json:/opt/keycloak/data/import/behind-realm.json:ro
      - ./infra/keycloak/themes/behind:/opt/keycloak/themes/behind:ro
    depends_on:
      identity-db: { condition: service_healthy }
      mailpit: { condition: service_started }
    mem_limit: 1536m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3 | grep -q UP'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  business-data:
  identity-data:
  redis-data:
